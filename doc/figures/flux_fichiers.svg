    <line x1="175" y1="390" x2="175" y2="399" marker-end="url(#ar)"/>
    <line x1="522" y1="390" x2="522" y2="399" marker-end="url(#ar)"/>
    <line x1="175" y1="420" x2="175" y2="437" marker-end="url(#ar)"/>
    <line x1="175" y1="472" x2="175" y2="481" marker-end="url(#ar)"/>
    <line x1="522" y1="472" x2="522" y2="481" marker-end="url(#ar)"/>
