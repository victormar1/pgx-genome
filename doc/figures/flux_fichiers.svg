    <text x="522" y="332" text-anchor="middle">appels_externes.tsv</text>
  </g>

  <!-- livrables (sortie/) -->
  <g font-size="9" font-family="Consolas, Menlo, monospace" font-weight="700" fill="#11684F">
    <rect x="100" y="400" width="150" height="20" rx="10" fill="#DDF1E9" stroke="#1B9E77"/>
    <text x="175" y="414" text-anchor="middle">&lt;ECH&gt;.report.json</text>
    <rect x="447" y="400" width="150" height="20" rx="10" fill="#DDF1E9" stroke="#1B9E77"/>
    <text x="522" y="414" text-anchor="middle">match_warnings.txt</text>
    <rect x="110" y="482" width="130" height="20" rx="10" fill="#DDF1E9" stroke="#1B9E77"/>
    <text x="175" y="496" text-anchor="middle">CR_&lt;ECH&gt;.pdf</text>
    <rect x="457" y="482" width="130" height="20" rx="10" fill="#DDF1E9" stroke="#1B9E77"/>
    <text x="522" y="496" text-anchor="middle">provenance.json</text>
  </g>

  <!-- legende -->
  <g font-size="8.5" fill="#5F726B">
    <rect x="8" y="520" width="12" height="10" rx="2" fill="#E6F3EE" stroke="#1B9E77"/><text x="25" y="529">entrée (lecture seule)</text>
    <rect x="140" y="520" width="12" height="10" rx="2" fill="#fff" stroke="#17332B"/><text x="157" y="529">étage</text>
    <rect x="210" y="520" width="12" height="10" rx="5" fill="#F1F3F2" stroke="#C9D2CE"/><text x="227" y="529">intermédiaire (travail/, ~0,37 Go, à purger)</text>
    <rect x="455" y="520" width="12" height="10" rx="5" fill="#DDF1E9" stroke="#1B9E77"/><text x="472" y="529">livrable (sortie/, ~1,5 Mo)</text>
