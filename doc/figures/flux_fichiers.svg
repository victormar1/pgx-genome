<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 724 564" width="724" height="564" font-family="Segoe UI, -apple-system, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Flux de fichiers du module PGx, de la CRAM au compte rendu">
  <rect x="0.5" y="0.5" width="723" height="563" rx="10" fill="#FBFAF7" stroke="#E2E6E3"/>
  <g transform="translate(12,12)">
