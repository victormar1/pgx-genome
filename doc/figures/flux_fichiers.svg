    <line x1="261" y1="174" x2="261" y2="191" marker-end="url(#ar)"/>
    <polyline points="311,164 433,164 433,191" marker-end="url(#ar)"/>
    <!-- R4 -> fichiers R4 -->
    <line x1="175" y1="226" x2="175" y2="235" marker-end="url(#ar)"/>
    <line x1="433" y1="226" x2="433" y2="235" marker-end="url(#ar)"/>
