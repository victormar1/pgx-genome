    <line x1="89" y1="42" x2="89" y2="57" marker-end="url(#ar)"/>
    <line x1="261" y1="42" x2="261" y2="57" marker-end="url(#ar)"/>
    <line x1="433" y1="42" x2="433" y2="57" marker-end="url(#ar)"/>
    <line x1="608" y1="42" x2="608" y2="57" marker-end="url(#ar)"/>
