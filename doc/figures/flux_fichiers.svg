  <rect x="8" y="58" width="684" height="34" rx="5" fill="#fff" stroke="#17332B"/>
  <text x="18" y="72" font-size="10.5" font-weight="700" fill="#17332B"><tspan fill="#1B9E77">0 · </tspan>Recevabilité</text>
