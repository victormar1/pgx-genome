    <rect x="524" y="6" width="168" height="36" rx="5" fill="#E6F3EE" stroke="#1B9E77"/>
    <text x="608" y="21" text-anchor="middle" font-weight="700">Ressources figées</text>
    <text x="608" y="35" text-anchor="middle" font-size="8.5" fill="#5F726B">258 régions · 1 226 positions · 12 gènes</text>
  </g>

