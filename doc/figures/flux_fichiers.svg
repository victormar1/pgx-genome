    <rect x="180" y="110" width="162" height="34" rx="5" fill="#fff" stroke="#17332B"/>
    <text x="261" y="124" text-anchor="middle" font-weight="700"><tspan fill="#1B9E77">2a · </tspan>Tranche</text>
    <text x="261" y="137" text-anchor="middle" font-size="8.5" fill="#5F726B">cible + CMH + contigs HLA</text>

    <rect x="524" y="110" width="168" height="34" rx="5" fill="#fff" stroke="#17332B"/>
    <text x="608" y="124" text-anchor="middle" font-weight="700"><tspan fill="#1B9E77">3 · </tspan>CYP2D6 — Cyrius</text>
    <text x="608" y="137" text-anchor="middle" font-size="8.5" fill="#5F726B">CRAM entière · ~3 000 régions</text>

    <rect x="8" y="192" width="334" height="34" rx="5" fill="#fff" stroke="#17332B"/>
    <text x="175" y="206" text-anchor="middle" font-weight="700"><tspan fill="#1B9E77">2b · </tspan>Contrôle qualité des positions</text>
    <text x="175" y="219" text-anchor="middle" font-size="8.5" fill="#5F726B">profondeur sur la tranche · GT seul · ./. si hors seuil</text>

    <rect x="352" y="192" width="162" height="34" rx="5" fill="#fff" stroke="#17332B"/>
    <text x="433" y="206" text-anchor="middle" font-weight="700"><tspan fill="#1B9E77">4 · </tspan>HLA — OptiType</text>
    <text x="433" y="219" text-anchor="middle" font-size="8.5" fill="#5F726B">lectures CMH · ≥ 200 paires</text>

    <rect x="352" y="274" width="340" height="34" rx="5" fill="#fff" stroke="#17332B"/>
    <text x="522" y="288" text-anchor="middle" font-weight="700"><tspan fill="#1B9E77">5 · </tspan>Appels externes</text>
    <text x="522" y="301" text-anchor="middle" font-size="8.5" fill="#5F726B">format PharmCAT -po · espaces autour du +</text>

    <rect x="8" y="356" width="684" height="34" rx="5" fill="#fff" stroke="#17332B"/>
    <text x="350" y="370" text-anchor="middle" font-weight="700"><tspan fill="#1B9E77">6 · </tspan>Interprétation — PharmCAT 3.4.0</text>
    <text x="350" y="383" text-anchor="middle" font-size="8.5" fill="#5F726B">préprocesseur --absent-to-ref · 22 gènes interprétés · aucun repli</text>

    <rect x="8" y="438" width="334" height="34" rx="5" fill="#fff" stroke="#17332B"/>
    <text x="175" y="452" text-anchor="middle" font-weight="700"><tspan fill="#1B9E77">7 · </tspan>Compte rendu</text>
    <text x="175" y="465" text-anchor="middle" font-size="8.5" fill="#5F726B">report.json + perimetre.json · 12 gènes rapportés</text>

    <rect x="352" y="438" width="340" height="34" rx="5" fill="#fff" stroke="#17332B"/>
    <text x="522" y="452" text-anchor="middle" font-weight="700">Provenance <tspan font-weight="400" font-size="8.5" fill="#5F726B">(toujours exécutée)</tspan></text>
    <text x="522" y="465" text-anchor="middle" font-size="8.5" fill="#5F726B">empreintes CRAM/VCF/FASTA · hash ressources · images · état des 9 étages</text>
  </g>

