name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controles:
    name: Contrôles, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.8 : la version minimale annoncée par le README.
          - python: "3.8"
            os: ubuntu-22.04
          - python: "3.13"
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Tout l'historique, pour valider chaque message ; sur une pull
          # request, la tête de branche et non le commit de fusion de GitHub.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Dépendances
        run: python -m pip install -r env/requirements.txt

      - name: Tests
        run: python -m unittest discover -s tests

      - name: Contrôles du dépôt
        run: python outils/verifier_depot.py

      - name: Messages de commit
        run: |
          for c in $(git rev-list HEAD); do
            git log -1 --format=%B "$c" > "$RUNNER_TEMP/message"
            if ! python outils/valider_message.py "$RUNNER_TEMP/message" 2>/dev/null; then
              git log -1 --format='commit %h : %s' "$c"
              python outils/valider_message.py "$RUNNER_TEMP/message"
              exit 1
            fi
          done
          echo "$(git rev-list --count HEAD) messages conformes"
